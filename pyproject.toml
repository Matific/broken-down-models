[tool.poetry]
name = "broken-down-models"
version = "0.5.0"
description = "A set of utlities for breaking a large Django model down to separate components"
readme = "README.rst"
homepage = "https://github.com/Matific/broken-down-models"
documentation = "https://broken-down-models.readthedocs.io/en/latest/intro.html"
authors = ["Shai Berger <shai.berger@slatescience.com>"]
license = "MIT"
packages = [
    {include = "bdmodels"},
]
exclude = ["bdmodels/tests.py"]

classifiers = [
    # Classifiers for Python versions and license added automatically by Poetry
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
keywords = ["Django", "models", "database", "optimization", "refactoring"]

[tool.poetry.dependencies]
python = "^3.9"
django = ">= 4.2"

[tool.poetry.group.dev.dependencies]
ipython = "*"
flake8 = "*"
tox = "^4.24.1"
Sphinx = "~7.4.7"
sphinx-rtd-theme = "~3.0.2"
dj-database-url = "^2.3.0"

[tool.tox]
# Note: Per https://github.com/tox-dev/tox/discussions/3648 the legacy ini cannot be
# replaced by native pyproject.toml without duplicating definitions for factors
# (i.e. explicitly listing combinations of Python and Django etc)
legacy_tox_ini = """
[tox]
envlist = py39-django42-{sqlt,pg2,pg3}, py{310,311,312}-django{42,52}-{sqlt,pg2,pg3}, py{313,314}-django{52,60,main}-{sqlt,pg2,pg3}
isolated_build = True
skipsdist = True

[testenv]
deps =
    flake8

    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    djangomain: git+https://github.com/django/django.git@main#egg=django
    pg2: psycopg2-binary
    pg3: psycopg[binary]
    dj-database-url>=2.3.0,<3.0

changedir = test_bdmodels

passenv = BDMODELS_DB

commands =
    flake8 ..
    python manage.py test bdmodels testapp testmigs {posargs}
"""

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
